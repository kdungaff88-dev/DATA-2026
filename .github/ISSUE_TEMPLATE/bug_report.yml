name: Báo lỗi
description: Báo lỗi mã, schema hoặc profiling kèm các bước tái hiện.
title: "[Lỗi]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Vấn đề
      description: Điều gì đã xảy ra và kết quả mong đợi là gì?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Cách tái hiện
      description: Cung cấp lệnh tối thiểu và mô tả đầu vào tổng hợp hoặc đã loại thông tin nhạy cảm.
      placeholder: Không đính kèm bộ dữ liệu thô, thông tin xác thực hoặc dữ liệu cá nhân.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Phiên bản môi trường chạy
      placeholder: Python, DuckDB, hệ điều hành
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Kết quả đã làm sạch
      description: Xóa secret, dữ liệu cá nhân và bản ghi dữ liệu nguồn.
    validations:
      required: false
