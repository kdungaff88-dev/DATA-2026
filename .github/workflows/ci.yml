name: Kiểm tra tự động

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Cài dependency phát triển
        run: python -m pip install -r requirements-dev.txt
      - name: Kiểm tra lint
        run: ruff check .
      - name: Kiểm tra cú pháp
        run: python -m compileall -q tools tests
      - name: Chạy kiểm thử
        run: python -m pytest -q
