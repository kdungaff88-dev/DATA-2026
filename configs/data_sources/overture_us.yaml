source_id: overture_us
provider: Overture Maps Foundation

# `latest` được phân giải thành phiên bản cụ thể và ghi vào manifest mỗi lần chạy.
release: latest
release_catalog_url: https://stac.overturemaps.org/catalog.json
release_url: https://docs.overturemaps.org/getting-data/overturemaps-py/
retrieved_at_utc: null

region:
  name: us_census_state_equivalents
  country: US
  coverage: "50 bang, Washington, DC và các lãnh thổ được liệt kê trong Census TIGERweb 2025"
  # Bbox chỉ giảm lượng dữ liệu đọc từ xa; ranh giới Census mới quyết định dữ liệu đầu ra.
  prefilter_bboxes_wsen:
    lower_48:
      - -125.0
      - 24.0
      - -66.0
      - 49.5
    alaska:
      - -180.0
      - 51.0
      - -129.0
      - 72.0
    hawaii:
      - -161.0
      - 18.0
      - -154.0
      - 23.0
    puerto_rico_usvi:
      - -68.5
      - 17.0
      - -64.0
      - 19.5
    guam_northern_mariana:
      - 144.0
      - 13.0
      - 147.0
      - 21.0
    american_samoa:
      - -172.0
      - -15.0
      - -168.0
      - -10.0
  boundary:
    source_id: census_tigerweb_acs2025_us_state
    edition: 2025
    url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_ACS2025/MapServer/80/query
    documentation_url: https://catalog.data.gov/dataset/tiger-line-shapefile-2025-nation-u-s-state-and-equivalent-entities
    layer_id: 80
    boundary_path: data/raw/census/tigerweb=acs2025/us_states.geojson
    source_crs: EPSG:4326
    target_crs: EPSG:4326
    layer_description: "States (or statistically equivalent entities); January 1, 2025 vintage"
    included_statefp:
      - "01"
      - "02"
      - "04"
      - "05"
      - "06"
      - "08"
