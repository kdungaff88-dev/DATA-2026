themes:
  selected:
    - places
  types:
    addresses: [address]
    base: [bathymetry, infrastructure, land, land_cover, land_use, water]
    buildings: [building, building_part]
    divisions: [division, division_area, division_boundary]
    places: [place]
    transportation: [segment, connector]

acquisition:
  state: ready_not_run
  method: overturemaps_python_client_geoparquet
  raw_root: data/raw/overture
  raw_path_template: data/raw/overture/release={release}/region={region}/run={run_id}/theme={theme}/type={type}/
  expected_bytes: null
  checksum: sha256
  output_format: geoparquet

license_review:
  state: pending_theme_specific_review
  common_documentation:
    - https://docs.overturemaps.org/theme-definitions-table.html
    - https://docs.overturemaps.org/attribution/
  documentation_by_theme:
    addresses: https://docs.overturemaps.org/guides/addresses/
    base: https://docs.overturemaps.org/guides/base/
    buildings: https://docs.overturemaps.org/guides/buildings/
    divisions: https://docs.overturemaps.org/guides/divisions/
    places: https://docs.overturemaps.org/guides/places/
    transportation: https://docs.overturemaps.org/guides/transportation/
  attribution_required: true
  commercial_redistribution_approved: false

profiling:
  categories: observed_from_release
  metrics:
    - row_count
    - schema
    - null_rate
    - blank_string_rate
    - empty_list_rate
    - duplicate_id_rate
    - geometry_and_address_availability
    - confidence_distribution
    - operating_status_distribution
